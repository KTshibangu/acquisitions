name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      NODE_OPTIONS: --experimental-vm-modules
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/acquisitions_test' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite with coverage
        id: run_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- --coverage 2>&1 | tee test-output.log

      - name: Annotate test failures
        if: steps.run_tests.outcome == 'failure'
        shell: bash
        run: |
          if [[ -f test-output.log ]]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^FAIL[[:space:]]+(.+)$ ]]; then
                echo "::error title=Failing test suite::$line"
              fi
            done < test-output.log
          fi
          echo "::notice title=Suggested fix::Run 'npm test -- --coverage' locally after fixing failing tests."

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish test summary
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.run_tests.outcome }}" == "success" ]]; then
            echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
            echo "- Status: Failed" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f coverage/coverage-summary.json ]]; then
            node -e "const fs=require('fs');const coverage=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));const total=coverage.total||{};const pct=(metric)=>metric&&metric.pct!==undefined?metric.pct:'N/A';const lines=['','## Coverage Summary','- Lines: '+pct(total.lines)+'%','- Statements: '+pct(total.statements)+'%','- Functions: '+pct(total.functions)+'%','- Branches: '+pct(total.branches)+'%'];fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "- Coverage report not found in \`coverage/\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail workflow if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
